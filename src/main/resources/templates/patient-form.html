<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Prendre un rendez-vous</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #fff;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
            padding: 40px;
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Indicateur d'étape (1/2) */
        .steps {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        .step-dot {
            width: 32px;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
        }

        .step-dot.active {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #e5e5e5;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        input:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(118,75,162,0.15);
        }

        input.is-invalid { border-color: #e53935; }

        .error-msg {
            color: #e53935;
            font-size: 12px;
            margin-top: 5px;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .global-error {
            background: #fdecea;
            color: #e53935;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 6px 16px rgba(118,75,162,0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            margin-top: 10px;
        }

        button:hover { box-shadow: 0 8px 20px rgba(118,75,162,0.45); }
        button:active { transform: scale(0.97); }

        .info-note {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 18px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Book an Appointment</h1>
    <p class="subtitle">Step 1: Your Information</p>

    <div class="steps">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
    </div>

    <!-- Global error message (e.g., session expired, email not verified) -->
    <div class="global-error" th:if="${error}" th:text="${error}"></div>

    <form th:action="@{/rdv/patient}" th:object="${patientRequest}" method="post" novalidate>

        <div class="field">
            <label>Full Name</label>
            <input type="text" th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                   placeholder="E.g.: Jack Wilson">
            <div class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="field">
            <label>Email</label>
            <input type="email" th:field="*{email}"
                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   placeholder="example@email.com">
            <div class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="field">
            <label>Phone</label>
            <input type="tel" th:field="*{phone}"
                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                   placeholder="+1234567890">
            <div class="error-msg" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        </div>

        <button type="submit">Continue →</button>
    </form>

    <p class="info-note">
        A confirmation email will be sent to you.<br>
        You will be able to choose your appointment date after confirming your email address.
    </p>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vérifiez votre email</title>
    <style>
        body { font-family:'Segoe UI',sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); min-height:100vh; display:flex; align-items:center; justify-content:center; margin:0; }
        .box { background:#fff; padding:50px; border-radius:16px; text-align:center; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,0.25); animation:pop .5s ease; }
        @keyframes pop { 0%{transform:scale(.7);opacity:0;} 100%{transform:scale(1);opacity:1;} }
        .icon { width:70px; height:70px; background:linear-gradient(135deg,#667eea,#764ba2); border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:32px; margin:0 auto 20px; }
        h1 { color:#333; margin-bottom:10px; font-size:22px; }
        p { color:#888; line-height:1.6; }
    </style>
</head>
<body>
<div class="box">
    <div class="icon">✉️</div>
    <h1>Check Your Inbox</h1>
    <p>We have sent you a confirmation link (check your inbox or spam folder). Click it to continue and choose the date of your appointment.</p>
</div>
</body>
</html>

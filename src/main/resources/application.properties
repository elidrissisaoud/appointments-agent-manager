
spring.application.name=appointment-system-v1.0
server.port =

#configuration of postgresql database

# ==============================
# Datasource PostgreSQL
# ==============================
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# Flyway
# ==============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=${spring.datasource.username}
spring.flyway.password=${spring.datasource.password}

# configuration of ai agent :

spring.ai.mistralai.api-key=
spring.ai.mistralai.chat.model=mistral-small-latest

#configuration of email service

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=7000
spring.mail.properties.mail.smtp.timeout=7000
spring.mail.properties.mail.smtp.writetimeout=7000

# Google calender configuration

google.calendar.credentials.path=classpath:credentials/service-account.json
google.calendar.calendar-id=
google.calendar.application.name=

# your clinic time and date configuration :

app.begin.hour=9
app.begin.minute=0
app.end.hour=18
app.end.minute=0
app.duration.minutes=60
app.jours-fermes=SATURDAY,SUNDAY

# URL link of your application (ex : www.myClinic.com)

app.public-url=

# and in the browser to have the form use (www.myClinic.com/rdv/patient)  this is the link that your patient will have to take an appointment


# configuration of telegram connection:

telegram.bot.token=
telegram.bot.api-url=https://api.telegram.org
telegram.webhook.path=/webhook/telegram

spring.jackson.property-naming-strategy=SNAKE_CASE
telegram.admin.chat-id=
